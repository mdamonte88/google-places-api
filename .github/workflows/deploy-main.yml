name: Deploy Google Places API

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            cd /var/www/googlemaps_backend/google-places-api

            test "$(git branch --show-current)" = "main"
            test -z "$(git status --porcelain)"
            git pull --ff-only origin main

            /var/www/googlemaps_backend/venv/bin/python -m pip install -r requirements.txt

            if pm2 describe "locations.gomarket.com.uy" >/dev/null 2>&1; then
              pm2 restart "locations.gomarket.com.uy" \
                --interpreter /var/www/googlemaps_backend/venv/bin/python \
                --update-env
            else
              pm2 start api.py \
                --name "locations.gomarket.com.uy" \
                --interpreter /var/www/googlemaps_backend/venv/bin/python
            fi

            pm2 save
